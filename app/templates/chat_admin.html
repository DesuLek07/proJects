<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Mesa de Ayuda</title>
  <link rel="stylesheet" href="../static/dashboard.css">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    .chat-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 75vh;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #f5f6fa;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .chat-message {
      background: #ecf0f1;
      margin: 6px 0;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .chat-message.user {
      background: #2ecc71;
      color: #fff;
      align-self: flex-end;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .chat-input-area button {
      background: #34495e;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .chat-input-area button:hover {
      background: #2c3e50;
    }
  </style>
</head>

<body>
  <!-- Sidebar igual que el dashboard -->
   {% include 'components/sidebar.html' %}

  <!-- Contenido principal -->
  <main class="main-content">
    <div class="chat-container">
      <div class="chat-header">
        <h2>💬 Chat en tiempo real</h2>
        <p><strong>Rol:</strong> {{ rol }} | <strong>Usuario:</strong> {{ username }}</p>
      </div>

      <div id="chat-box" class="chat-box"></div>

      <div class="chat-input-area">
        <input type="text" id="msg" placeholder="Escribe un mensaje..." autofocus>
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </main>

  <script>
    const socket = io("http://localhost:5860"); // Puerto de tu Flask principal
    const username = "{{ username }}";
    const room = "{{ room }}";

    socket.emit("join", { username, room });

    const chatBox = document.getElementById("chat-box");

    socket.on("message", data => {
      const msg = document.createElement("div");
      msg.classList.add("chat-message");
      if (data.msg.includes(username)) msg.classList.add("user");
      msg.textContent = data.msg;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    function sendMessage() {
      const input = document.getElementById("msg");
      const text = input.value.trim();
      if (text !== "") {
        socket.emit("message", { username, room, msg: text });
        input.value = "";
      }
    }

    document.getElementById("msg").addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
