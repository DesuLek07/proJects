<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat Privado - Mesa de Ayuda</title>
  <link rel="stylesheet" href="../static/dashboard.css">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    /* ======== CHAT PRIVADO ======== */
    .chat-wrapper {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #34495e;
      color: #fff;
      padding: 15px 20px;
      font-size: 1.1rem;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f5f6fa;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .mensaje {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
      animation: fadeIn 0.2s ease;
    }

    .mensaje.enviado {
      align-self: flex-end;
      background: #dcf8c6;
      border-bottom-right-radius: 4px;
    }

    .mensaje.recibido {
      align-self: flex-start;
      background: #e9ebee;
      border-bottom-left-radius: 4px;
    }

    .mensaje .hora {
      font-size: 0.75rem;
      color: #777;
      position: absolute;
      bottom: -15px;
      right: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-input {
      display: flex;
      padding: 15px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus {
      border-color: #0066ff;
    }

    .btn-enviar {
      background: #0066ff;
      color: #fff;
      border: none;
      margin-left: 10px;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-enviar:hover {
      background: #004ecc;
    }

    .empty-chat {
      text-align: center;
      color: #888;
      font-style: italic;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  {% include 'components/sidebar.html' %}

  <!-- Main -->
  <main class="main-content">
    <header class="header">
      <h1>Chat Privado 💬</h1>
      <input type="text" class="search-bar" placeholder="Buscar conversación..." disabled>
    </header>

    <section class="chat-wrapper">
      <div class="chat-header">
        <span>Conversación con {{ receiver.username }}</span>
        <span>🟢 En línea</span>
      </div>

      <div class="chat-box" id="mensajes">
        {% if mensajes %}
          {% for m in mensajes %}
            <div class="mensaje {% if m.sender_id == session['user_id'] %}enviado{% else %}recibido{% endif %}">
              <p>{{ m.contenido }}</p>
              <span class="hora">{{ m.fecha_envio.strftime('%H:%M') }}</span>
            </div>
          {% endfor %}
        {% else %}
          <p class="empty-chat">No hay mensajes todavía. ¡Empieza la conversación!</p>
        {% endif %}
      </div>

      <div class="chat-input">
        <input type="text" id="msgInput" placeholder="Escribe un mensaje...">
        <button class="btn-enviar" onclick="enviar()">Enviar</button>
      </div>
    </section>
  </main>

  <script>
    const socket = io();
    const user_id = {{ session['user_id'] }};
    const receiver_id = {{ receiver.id }};

    socket.emit('join_private', { user_id, target_id: receiver_id });

    function enviar() {
      const msgInput = document.getElementById('msgInput');
      const msg = msgInput.value.trim();
      if (msg === '') return;

      socket.emit('private_message', { sender_id: user_id, receiver_id, msg });
      msgInput.value = '';
    }

    socket.on('message', data => {
      const chatBox = document.getElementById('mensajes');
      const esMio = data.sender_id === user_id;
      const div = document.createElement('div');
      div.classList.add('mensaje', esMio ? 'enviado' : 'recibido');
      div.innerHTML = `<p>${data.msg}</p>
        <span class="hora">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
